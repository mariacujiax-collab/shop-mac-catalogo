  $('#dr').innerHTML=`<div class="dh"><h2>Tu pedido</h2><button class="x" data-a="close" aria-label="Cerrar">${ico('x')}</button></div><div class="db">${r.length?r.map(p=>`<div class="ln"><div class="th">${ok(p.img)?`<img src="${p.img}" alt="">`:''}</div><div class="lt"><b>${esc(p.name)}</b><small>${p.type==='perfume'&&p.ml?esc(p.ml)+' ml · ':''}${m(unit(p))}</small><div class="q"><button data-a="dec" data-id="${p.id}" aria-label="Quitar uno">−</button><span>${cart[p.id]}</span><button data-a="inc" data-id="${p.id}" aria-label="Agregar uno">+</button></div></div><b>${m(unit(p)*cart[p.id])}</b></div>`).join(''):'<p class="empty">Tu carrito está vacío.</p>'}</div>`+(r.length?`<div class="df">${r.some(p=>p.ship)?`<div class="dv"><button data-a="dv" data-id="base" class="${dv==='base'?'on':''}">Sin envío</button><button data-a="dv" data-id="ship" class="${dv==='ship'?'on':''}">Envío local</button></div>`:''}<div class="tt"><span>Total</span><b>${m(total())}</b></div><input id="cn" placeholder="Tu nombre (opcional)" value="${esc(cname)}">${wa?`<a id="wa" class="btn" target="_blank" rel="noopener" href="${wa}">Enviar pedido por WhatsApp</a>`:'<button class="btn" disabled>WhatsApp sin configurar</button>'}<button class="lk" data-a="clear">Vaciar carrito</button></div>`:'');
}
const openCart=o=>{$('#dr').classList.toggle('o',o);$('#sc').hidden=!o};
let tt;const toast=t=>{const e=$('#ts');e.textContent=t;e.hidden=false;clearTimeout(tt);tt=setTimeout(()=>e.hidden=true,1600)};
const msg=t=>{const e=$('#ams');if(e)e.textContent=t};
let mid=null;
function rMd(){
  const e=$('#md'),p=mid&&prod(mid);
  if(!p){mid=null;e.hidden=true;e.innerHTML='';return}
  const f=fav.includes(p.id),sold=!p.av,sale=p.old>p.price;e.hidden=false;
  e.innerHTML=`<div class="mdc${sold?' sold':''}" role="dialog" aria-label="${esc(p.name)}"><button class="mdx" data-a="mclose" aria-label="Cerrar">${ico('x')}</button><div class="im">${ok(p.img)?`<img src="${p.img}" alt="${esc(p.name)}">`:'<div class="ph">MAC</div>'}${sold?'<span class="tg">Agotado</span>':sale?'<span class="tg">Oferta</span>':''}</div><div class="mdi"><h3>${esc(p.name)}</h3>${p.type==='perfume'&&p.ml?`<p class="ml">${esc(p.ml)} ml</p>`:''}<p class="nt">${esc(p.notes)}</p><div class="pr"><b>${m(p.price)}</b>${sale?`<s>${m(p.old)}</s>`:''}${p.ship?`<small>Con envío local: ${m(p.ship)}</small>`:''}</div><div class="mda"><button class="fv${f?' on':''}" data-a="fav" data-id="${p.id}" aria-label="Favorito">${ico('heart')}</button><button class="btn" data-a="add" data-id="${p.id}"${sold?' disabled':''}>${sold?'Agotado':'Agregar al carrito'}</button></div>${cart[p.id]>0&&p.av?`<button class="btn go2" data-a="topedido">Continuar con tu pedido →</button>`:''}</div></div>`;
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){mid=null;rMd();openCart(false)}});
function rAdm(){
  const el=$('#ad');el.hidden=!admOpen;if(!admOpen)return;
  const s=W.s,p=editing;let b;
  if(p){b=`<h3 style="margin-top:20px">${p.isNew?'Nuevo producto':'Editar producto'}</h3>
<label>Tipo<select data-k="p.type" data-r><option value="perfume"${p.type==='perfume'?' selected':''}>Perfume</option><option value="accesorio"${p.type!=='perfume'?' selected':''}>Accesorio</option></select></label>
<label>Nombre<input data-k="p.name" value="${esc(p.name)}"></label>
${p.type==='perfume'?`<label>Mililitros (ml)<input data-k="p.ml" data-n type="number" inputmode="numeric" value="${esc(p.ml||'')}"></label>`:''}
<label>Precio en pesos<input data-k="p.price" data-n type="number" inputmode="numeric" value="${esc(p.price||'')}"></label>
<label>Precio anterior (opcional, muestra la oferta)<input data-k="p.old" data-n type="number" inputmode="numeric" value="${esc(p.old||'')}"></label>
<label>Precio con envío local (opcional)<input data-k="p.ship" data-n type="number" inputmode="numeric" value="${esc(p.ship||'')}"></label>
<label>${p.type==='perfume'?'Descripción olfativa':'Descripción'}<textarea data-k="p.notes" rows="4">${esc(p.notes)}</textarea></label>
<div class="up"><div class="pv">${ok(p.img)?`<img src="${p.img}" alt="">`:'Sin foto'}</div><label class="btn ghost" style="margin:0">Subir foto desde mi computador<input type="file" accept="image/*" data-up="p" hidden></label>${ok(p.img)?'<button class="lk" data-a="rmimg">Quitar foto</button>':''}</div>
<label class="chk"><input type="checkbox" data-k="p.av"${p.av?' checked':''}> Disponible</label>
<div class="row"><button class="btn" data-a="save">Guardar producto</button><button class="btn ghost" data-a="cancel">Cancelar</button></div>`}
  else if(tab==='prod'){b=`<div class="row"><button class="btn" data-a="new" style="width:auto">+ Nuevo producto</button></div>`+(W.p.map(q=>`<div class="ar"><label class="th" style="cursor:pointer" title="Subir foto">${ok(q.img)?`<img src="${q.img}" alt="">`:'+ Foto'}<input type="file" accept="image/*" data-up="r" data-id="${q.id}" hidden></label><div class="lt"><b>${esc(q.name)}</b><small>${q.type==='perfume'?'Perfume':'Accesorio'} · ${m(q.price)}</small></div><button class="sw${q.av?' on':''}" data-a="tgl" data-id="${q.id}">${q.av?'Disponible':'Agotado'}</button><button class="lk" data-a="edit" data-id="${q.id}">Editar</button><button class="lk" data-a="del" data-id="${q.id}">${armed===q.id?'¿Seguro?':'Eliminar'}</button></div>`).join('')||'<p class="empty">Aún no tienes productos.</p>')}
  else{b=`<label>Lema<input data-k="s.slogan" value="${esc(s.slogan)}"></label>
<label>WhatsApp con código de país, solo números (ej. 573001234567)<input data-k="s.wa" inputmode="numeric" value="${esc(s.wa)}"></label>
<label>Usuario de Instagram<input data-k="s.ig" value="${esc(s.ig)}"></label>
<label class="chk" style="margin-top:22px"><input type="checkbox" data-k="s.bf"${s.bf?' checked':''}> Mostrar franja de Black Friday</label>
<label>Texto de la franja<input data-k="s.bfText" value="${esc(s.bfText)}"></label>
<label class="chk" style="margin-top:22px"><input type="checkbox" data-k="s.xmas"${s.xmas?' checked':''}> Diseño navideño (franja vino tinto y portada)</label>
<label class="chk"><input type="checkbox" data-k="s.snow"${s.snow?' checked':''}> Copos de nieve</label>
<div class="up"><div class="pv"><img src="${logo()}" alt=""></div><label class="btn ghost" style="margin:0">Cambiar foto de portada<input type="file" accept="image/*" data-up="logo" hidden></label>${ok(s.logo)?'<button class="lk" data-a="rmlogo">Volver a la original</button>':''}</div>`}
  el.innerHTML=`<div class="am"><div class="ah"><b>Administrar tienda</b><div><button class="btn pub${dirty?' dirty':''}" id="pub" data-a="pub">Publicar cambios</button><button class="x" data-a="admclose" aria-label="Cerrar">${ico('x')}</button></div></div><div class="at"><button data-a="atab" data-id="prod" class="${tab==='prod'?'on':''}">Productos</button><button data-a="atab" data-id="set" class="${tab==='set'?'on':''}">Tienda y temporada</button></div><p id="ams">${dirty?'Tienes cambios sin publicar: tus clientes los verán al pulsar Publicar cambios.':'Lo que cambies aquí se ve al instante; tus clientes lo ven al publicar.'}</p>${b}</div>`;
}
async function pub(){
  if(!art)return msg('Publicar no está disponible en esta vista.');
  msg('Publicando…');
  try{await art.publish(SRC.replace(/(<script type="application\/json" id="state">)[\s\S]*?(<\/script>)/,(x,a,c)=>a+JSON.stringify(W).replace(/</g,'\\u003c')+c))}
  catch(e){msg(e&&e.code==='conflict'?'Se publicó otra versión antes. Recarga la página y repite el cambio.':'No se pudo publicar: '+((e&&(e.message||e.code))||'error'))}
}
function shrink(f){return new Promise((res,rej)=>{const r=new FileReader();r.onerror=()=>rej(Error('No se pudo leer el archivo'));r.onload=()=>{const i=new Image();i.onerror=()=>rej(Error('El archivo no es una imagen válida'));i.onload=()=>{const k=Math.min(1,1000/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=Math.round(i.width*k);c.height=Math.round(i.height*k);c.getContext('2d').drawImage(i,0,0,c.width,c.height);c.toBlob(b=>b?res(b):rej(Error('No se pudo procesar la imagen')),'image/jpeg',.85)};i.src=r.result};r.readAsDataURL(f)})}
const act={
  go(){$('#tabs').scrollIntoView({behavior:'smooth'})},
  open(id){mid=id;rMd()},mclose(){mid=null;rMd()},topedido(){mid=null;rMd();openCart(true)},
  tab(id){filt=id;page()},
  favs(){filt='fav';page();act.go()},
  fav(id){fav=fav.includes(id)?fav.filter(x=>x!==id):[...fav,id];save();page()},
  add(id){cart[id]=(cart[id]||0)+1;save();page();if(!mid)toast('Agregado al carrito')},
  inc(id){cart[id]=(cart[id]||0)+1;save();page()},
  dec(id){cart[id]--;if(cart[id]<=0)delete cart[id];save();page()},
  clear(){cart={};save();page()},
  dv(id){dv=id;ls.set('mac_dv',id);page()},
  more(id,t){const n=t.previousElementSibling;const o=n.classList.toggle('open');t.textContent=o?'Ver menos':'Ver notas completas'},
  cart(){openCart(true)},close(){openCart(false)},
  adm(){admOpen=true;rAdm()},admclose(){admOpen=false;editing=null;rAdm()},
  atab(id){tab=id;editing=null;rAdm()},
  new(){editing={id:'p'+Date.now().toString(36),type:'perfume',name:'',ml:100,price:0,ship:0,old:0,notes:'',img:'',av:true,isNew:true};rAdm()},
  edit(id){editing={...prod(id)};rAdm()},
  cancel(){editing=null;rAdm()},
  save(){if(!editing.name.trim())return msg('Escribe el nombre del producto.');const{isNew,...p}=editing;if(p.type!=='perfume')p.ml=0;const i=W.p.findIndex(x=>x.id===p.id);i<0?W.p.unshift(p):W.p[i]=p;editing=null;dirty=true;page();rAdm()},
  tgl(id){const p=prod(id);p.av=!p.av;dirty=true;page();rAdm()},
  del(id){if(armed===id){W.p=W.p.filter(p=>p.id!==id);armed=null;dirty=true;page()}else armed=id;rAdm()},
  rmimg(){editing.img='';rAdm()},
  rmlogo(){W.s.logo='';dirty=true;page();rAdm()},
  pub
};
document.addEventListener('click',e=>{if(e.target.id==='md'){act.mclose();return}const t=e.target.closest('[data-a]');if(t&&act[t.dataset.a])act[t.dataset.a](t.dataset.id,t)});
document.addEventListener('input',e=>{if(e.target.id==='cn'){cname=e.target.value;const a=$('#wa');if(a)a.href=waHref()}});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.dataset.up){const f=t.files[0];if(!f)return;if(!assets)return msg('Para subir fotos abre la tienda con tu cuenta de administrador.');msg('Subiendo foto…');
    try{const r=await assets.upload(await shrink(f));if(t.dataset.up==='p')editing.img=r.url;else if(t.dataset.up==='r'){prod(t.dataset.id).img=r.url;dirty=true;page()}else{W.s.logo=r.url;dirty=true;page()}rAdm();msg('Foto lista.')}catch(x){msg('No se pudo subir la foto: '+((x&&(x.message||x.code))||'error'))}return}
  const k=t.dataset.k;if(!k)return;const[o,f]=k.split('.');const g=o==='p'?editing:W.s;
  g[f]=t.type==='checkbox'?t.checked:t.hasAttribute('data-n')?(+t.value||0):t.value;
  if(o==='s'){dirty=true;const b=$('#pub');if(b)b.classList.add('dirty');page()}
  if(t.hasAttribute('data-r'))rAdm();
});
page();
(async()=>{
  if(!window.claude||!claude.use)return;
  try{const u=await claude.use('user');if(!u||!((await u.isOwner())||(await u.canEdit())))return;
    assets=await claude.use('assets');art=await claude.use('artifact');$('#ab').hidden=false}catch(e){}
})();
</script></body></html>
